<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Electural</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>body{margin:0;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:#7ecef4;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}a{color:#fff;font-weight:800}</style>
</head>
<body>
<div><h1>Page not found</h1><p><a id="home" href="/">&larr; Electural Home</a></p></div>
<script>
// On github.io project sites the site lives under /<repo>/
var p=location.pathname.split('/').filter(Boolean);
if(location.hostname.endsWith('github.io')&&p.length)document.getElementById('home').href='/'+p[0]+'/';
</script>
</body>
</html>
